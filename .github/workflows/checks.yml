name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install-printer.sh InstaladorDriberLinux.sh
      - name: Isolated CUPS contract tests
        run: python3 -m unittest discover -s tests -v
